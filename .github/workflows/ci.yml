name: ci

# PRs and every branch push. Chunk work merges into `dsl-sidequest` before
# `main`, so main-only would let a branch pass unseen.
on:
  push:
    branches: ['**']
  pull_request:

# One run per ref; a superseded push cancels the older runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-legal.txt

      - name: Install legal PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install -r engine/requirements-legal.txt

      # The repo gate. Deliberately DB-free: CI and worktrees may have no
      # Postgres, so a DB-optional gate would silently skip.
      - name: Verify
        run: pnpm verify

      # The local document package gate: real combined PDF, exact-byte hash,
      # source/template hashes, manifest and extracted-text checks.
      - name: Legal package gate
        run: bash scripts/legal-package-dod.sh

      # The SQL gate. Same job, after the repo gate, so a red on either stops
      # the run. No secrets: the local stack uses the CLI's own demo keys and
      # works on a fork PR.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Apply every migration
        run: supabase db reset --local
      - uses: extractions/setup-just@v2
      - name: SQL gate
        run: just verify-db
